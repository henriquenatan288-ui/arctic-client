name: Build Witch Client for Simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build Witch Client
        run: gradle build -Pedition=full --stacktrace

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: witch-client-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Trigger Witch Simulator
        env:
          SIMULATOR_TOKEN: ${{ secrets.SIMULATOR_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          CLIENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$SIMULATOR_TOKEN" ]; then
            echo "Secret SIMULATOR_DISPATCH_TOKEN ausente; build concluído, simulação não disparada."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SIMULATOR_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/henriquenatan288-ui/Witch-simulator/dispatches \
            -d "{\"event_type\":\"witch-client-built\",\"client_payload\":{\"source_sha\":\"$SOURCE_SHA\",\"client_run_id\":\"$CLIENT_RUN_ID\"}}"
